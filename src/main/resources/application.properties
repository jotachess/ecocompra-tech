spring.application.name=ecocompra-tech
server.port=8080

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecocompra_tech
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Validar las tablas creadas con el script
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Mostrar consultas durante el desarrollo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true