spring.application.name=ecocompra-tech
server.port=8080

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecocompra_tech
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Validar las tablas creadas con el script
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Mostrar consultas durante el desarrollo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# La respuesta HTTP no depende de una sesión de Hibernate abierta.
spring.jpa.open-in-view=false

# Actividad 03: sin secretos predeterminados. JWT_SECRET debe tener 32 bytes o mas.
security.jwt.secret=${JWT_SECRET}
security.jwt.ttl-seconds=1800
security.cors.origins=${CORS_ORIGINS:http://localhost:4200}
security.bootstrap.admin-password=${ADMIN_PASSWORD:}
security.bootstrap.vendedor-password=${VENDEDOR_PASSWORD:}
