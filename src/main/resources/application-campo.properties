# Practica local con persistencia en disco y datos ficticios.
spring.datasource.url=jdbc:h2:file:./.local/campo/ecocompra05;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
