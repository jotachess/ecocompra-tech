spring.application.name=ecocompra-tech-test

# Base de datos H2 en memoria configurada en modo MySQL para pruebas unitarias e integradas reproducibles
spring.datasource.url=jdbc:h2:mem:ecocompra_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
