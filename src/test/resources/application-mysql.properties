# Perfil opcional para una instancia MySQL de pruebas aislada y previamente creada.
# Nunca configurar la base de desarrollo o de producción en TEST_MYSQL_URL.
spring.datasource.url=${TEST_MYSQL_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TEST_MYSQL_USER}
spring.datasource.password=${TEST_MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false
